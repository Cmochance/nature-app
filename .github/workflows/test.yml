name: Test

# CI:前端(类型检查 + 构建)与 Rust(fmt + clippy + 单测)并行。
# Rust job 跑 macOS(本项目主平台,含 macOS 专属代码);前端纯 JS,跑 ubuntu 更快省时。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Type-check (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      - name: Build (tsc + vite)
        run: pnpm build

  rust:
    name: Rust — fmt + clippy + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (+ rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # codex sidecar 是 externalBin,build.rs 校验其存在 → cargo 前必须拉到位
      - name: Cache codex sidecar
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: codex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.codex-version') }}
      - name: Fetch codex sidecar
        run: bash scripts/fetch-codex.sh

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # 聚合门禁:满足分支保护要求的必需 check「test」(两个并行 job 都绿才绿)。
  test:
    name: test
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    steps:
      - run: echo "frontend + rust 均通过"
