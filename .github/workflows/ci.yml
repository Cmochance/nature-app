name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tauri 跨平台打包硬约束:macOS 必须在 macOS 构建、Windows MSI 必须在 Windows 构建。
# 故用 matrix 在各自平台原生构建。签名/公证留待配置 secrets 后启用(见末尾注释)。
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Frontend type-check + build
        run: pnpm build

      - name: Tauri build (unsigned)
        run: pnpm tauri build
        env:
          # 未配置签名;产出未签名安装包用于 CI 验证。
          # 启用签名后补:APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD(macOS 公证)
          # 与 Windows 代码签名证书。
          CI: "true"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: nature-app-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: ignore
